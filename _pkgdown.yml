title: ivx
url: https://kvasilopoulos.github.io/ivx/

template:
  bootstrap: 5
  bootswatch: cosmo
  math-rendering: mathjax

authors:
  Kostas Vasilopoulos:
    href: https://kvasilopoulos.netlify.com/
  Efthymios Pavlidis:
    href: https://sites.google.com/site/etpavlidis/

reference:
  - title: IVX estimation
    desc: >
      Predictive regressions with persistent regressors, short and long
      horizon (Kostakis, Magdalinos & Stamatogiannis 2015, 2023).
    contents:
      - ivx
      - ivx_sys

  - title: Extensions
    desc: Modifications of the IVX estimator for specific error structures or targets.
    contents:
      - ivx_ar
      - ivx_ra
      - ivx_qr

  - title: Robust and subsample inference
    desc: Wild bootstrap p-values and tests for pockets of predictability (Demetrescu et al. 2022, 2023).
    contents:
      - ivx_boot
      - ivx_qr_boot
      - ivx_episodic

  - title: Non-IVX benchmarks
    desc: Reduced-bias OLS alternatives for stationary persistent predictors.
    contents:
      - arm

  - title: Fitter functions
    desc: Low-level functions taking a response and a design matrix.
    contents:
      - ivx_fit
      - ivx_wfit
      - ivx_ar_fit
      - ivx_ra_fit
      - ivx_qr_fit
      - arm_fit
      - ivx_sys_fit

  - title: Serial correlation tests
    contents:
      - ac_test
      - ac_test_wald
      - ac_test_bp
      - ac_test_bg
      - ac_test_lb

  - title: Methods
    contents:
      - summary.ivx
      - summary.ivx_ar
      - vcov.ivx
      - delta
      - extract.ivx
      - extract.ivx_ar

  - title: Data
    contents:
      - kms
      - kms_quarterly
      - monthly
      - quarterly
      - ylpc

articles:
  - title: Methodology
    navbar: Methodology
    contents:
      - ivx
      - ivx-sys
      - ivx-ar
      - ivx-ra
      - ivx-qr
      - arm
  - title: Inference
    navbar: Inference
    contents:
      - robust-inference
      - ivx-episodic
      - rolling-ivx

navbar:
  structure:
    left:
    - home
    - reference
    - articles
    right:
    - news
    - github
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fa-github fa-lg
      href: https://github.com/kvasilopoulos/ivx
