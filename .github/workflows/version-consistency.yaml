on:
  push:
    branches: [main, master]
    paths:
      - DESCRIPTION
      - NEWS.md
      - CITATION.cff
  pull_request:
    paths:
      - DESCRIPTION
      - NEWS.md
      - CITATION.cff
  workflow_dispatch:

name: version-consistency.yaml

permissions: read-all

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    name: Version consistency

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Check DESCRIPTION, NEWS.md and CITATION.cff agree
        run: Rscript tools/version-consistency.R
